          \            \"validation_status\": \"error\",\n            \"validation_message\"\
          : f\"処理エラー: {str(e)}\"\n        }\n\ndef validate_json(data):\n    \"\"\"\
          \n    JSON構造を検証\n    \n    Args:\n        data: 検証対象のJSON構造\n    \n    Returns:\n\
          \        dict: valid (bool) と message (str) を含む辞書\n    \"\"\"\n    try:\n\
          \        # 必須フィールドの確認\n        if \"chapter\" not in data:\n           \
