    - data:
        code: "import json\n\ndef main(experiment_details) -> dict:\n    \"\"\"\n\
          \    各実験に図表番号を割り当てる\n    \n    Args:\n        experiment_details: structured_output形式のオブジェクト\n\
          \            - String型の場合: JSON文字列をパース\n            - Dict型の場合: そのまま使用\n\
          \    \n    Returns:\n        dict: experiment_with_figures をキーとする辞書\n  \
          \  \"\"\"\n    try:\n        # 入力型の判定と変換\n        if isinstance(experiment_details,\
          \ str):\n            # String型の場合: JSON文字列をパース\n            data = json.loads(experiment_details)\n\
          \        elif isinstance(experiment_details, dict):\n            # Dict型の場合:\
          \ そのまま使用\n            data = experiment_details\n        else:\n       \
          \     # その他の型の場合: エラー\n            return {\n                \"experiment_with_figures\"\
          : {\n                    \"error\": f\"Invalid input type: {type(experiment_details)}\"\
          \n                }\n            }\n        \n        # experiments配列を取得\n\
          \        if \"experiments\" in data:\n            experiments = data[\"\
          experiments\"]\n        else:\n            # structured_output全体が渡された場合\n\
          \            if \"structured_output\" in data:\n                experiments\
          \ = data[\"structured_output\"][\"experiments\"]\n            else:\n  \
          \              return {\n                    \"experiment_with_figures\"\
          : {\n                        \"error\": \"experiments key not found in input\"\
          \n                    }\n                }\n        \n        chapter =\
          \ 5  # 実験結果の章番号\n        \n        table_counter = 1\n        fig_counter\
          \ = 1\n        \n        result = []\n        \n        for exp in experiments:\n\
          \            exp_data = {\n                \"section\": exp.get(\"section\"\
          , \"\"),\n                \"idx\": exp.get(\"idx\", 0),\n              \
          \  \"subidx\": exp.get(\"subidx\"),\n                \"name\": exp.get(\"\
          name\", \"\"),\n                \"measurement_conditions\": exp.get(\"measurement_conditions\"\
          , \"\"),\n                \"experiment_type\": exp.get(\"experiment_type\"\
          , \"\"),\n                \"tool\": exp.get(\"tool\"),\n               \
          \ \"reference\": exp.get(\"reference\"),\n                \"tables\": [],\n\
          \                \"figures\": []\n            }\n            \n        \
          \    # 実験種類に応じて図表を割り当て\n            if exp.get(\"experiment_type\") == \"\
          測定\":\n                # データ表 + グラフ\n                exp_data[\"tables\"\
          ].append({\n                    \"number\": table_counter,\n           \
          \         \"label\": f\"表{chapter}.{table_counter}\",\n                \
          \    \"type\": \"data\"\n                })\n                table_counter\
          \ += 1\n                \n                exp_data[\"figures\"].append({\n\
          \                    \"number\": fig_counter,\n                    \"label\"\
          : f\"図{chapter}.{fig_counter}\",\n                    \"type\": \"graph\"\
          \n                })\n                fig_counter += 1\n               \
          \ \n            elif exp.get(\"experiment_type\") == \"計算\":\n         \
          \       # グラフのみ\n                exp_data[\"figures\"].append({\n      \
          \              \"number\": fig_counter,\n                    \"label\":\
          \ f\"図{chapter}.{fig_counter}\",\n                    \"type\": \"graph\"\
          \n                })\n                fig_counter += 1\n               \
          \ \n            elif exp.get(\"experiment_type\") == \"分析\":\n         \
          \       # 計算結果表 + グラフ\n                exp_data[\"tables\"].append({\n \
          \                   \"number\": table_counter,\n                    \"label\"\
          : f\"表{chapter}.{table_counter}\",\n                    \"type\": \"result\"\
          \n                })\n                table_counter += 1\n             \
          \   \n                exp_data[\"figures\"].append({\n                 \
          \   \"number\": fig_counter,\n                    \"label\": f\"図{chapter}.{fig_counter}\"\
          ,\n                    \"type\": \"graph\"\n                })\n       \
          \         fig_counter += 1\n            \n            result.append(exp_data)\n\
          \        \n        # 出力はObject型として返す（experiments配列を含むオブジェクト）\n        return\
          \ {\n            \"experiment_with_figures\": {\n                \"experiments\"\
          : result\n            }\n        }\n        \n    except Exception as e:\n\
          \        return {\n            \"experiment_with_figures\": {\n        \
          \        \"error\": f\"処理エラー: {str(e)}\"\n            }\n        }"
        code_language: python3
        desc: ''
        outputs:
          experiment_with_figures:
            children: null
            type: object
