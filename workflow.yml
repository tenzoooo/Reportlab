            に存在するときのみ用いる。存在しない場合は記述しない。過去形で出力。構成: ①目的と理論の要点 ②装置・手順の肝と注意点（安全事項があれば言及）出力は260〜340字、見出し・箇条書き・引用・絵文字は禁止、句点で終える。本文以外の出力は一切しないこと。難しい言葉は使わずに、日本語が苦手な理系大学生ということを加味して出力に反映させること。

            lab_text:

            <<<

            {{#1757759088515.text#}}

            >>>'
