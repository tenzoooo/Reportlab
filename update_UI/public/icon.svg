<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #0b1224;
      --glass: #dce6f5;
      --liquid: #1dd3f8;
      --bubble: #9be8ff;
      --highlight: #7dd3fc;
      --glow: #0ea5e9;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fb;
        --glass: #0f172a;
        --liquid: #0ea5e9;
        --bubble: #0f172a;
        --highlight: #2563eb;
        --glow: #22d3ee;
      }
    }
  </style>
  <rect width="180" height="180" rx="32" fill="var(--bg)" />
  <g filter="url(#softGlow)">
    <circle cx="90" cy="104" r="70" fill="var(--glow)" opacity="0.32" />
  </g>
  <g opacity="0.14">
    <path d="M24 118c18-12 48-18 66-8s40 7.5 64-9" stroke="var(--highlight)" stroke-width="6" stroke-linecap="round" />
    <path d="M46 54c9 10 27 14 42 10s28-15 44-16" stroke="var(--highlight)" stroke-width="6" stroke-linecap="round" />
  </g>
  <g filter="url(#flaskShadow)">
    <path
      d="M76 36h28c2.2 0 4 1.8 4 4v37l17 35.5c1.9 4-1 8.5-5.5 8.5H60.5c-4.5 0-7.4-4.5-5.5-8.5L72 77V40c0-2.2 1.8-4 4-4Z"
      fill="var(--glass)" />
    <path d="M60 96c18-7 42-7 60 0l8 17c1.4 3-0.8 6.5-4.2 6.5H56.2c-3.4 0-5.6-3.5-4.2-6.5Z"
      fill="var(--liquid)" fill-opacity="0.95" />
  </g>
  <rect x="76" y="36" width="28" height="11" rx="5.5" fill="var(--liquid)" fill-opacity="0.92" />
  <path d="M103 50v56" stroke="var(--highlight)" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <circle cx="90" cy="72" r="4" fill="var(--bubble)" />
  <circle cx="104" cy="82" r="3" fill="var(--bubble)" fill-opacity="0.85" />
  <circle cx="98" cy="66" r="3" fill="var(--bubble)" fill-opacity="0.8" />
  <circle cx="88" cy="108" r="4.5" fill="var(--bubble)" fill-opacity="0.9" />
  <defs>
    <filter id="softGlow" x="0" y="14" width="180" height="166" filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
    <filter id="flaskShadow" x="38" y="26" width="104" height="129" filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="black" flood-opacity="0.18" />
    </filter>
  </defs>
</svg>
